<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="720" y1="0" x2="720" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050811"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="300" x2="1440" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA" stop-opacity=".25"/><stop offset=".5" stop-color="#06B6D4" stop-opacity=".42"/><stop offset="1" stop-color="#4338CA" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="330" x2="1440" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/><stop offset=".48" stop-color="#06B6D4"/><stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="330" x2="1440" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/><stop offset=".5" stop-color="#A5F3FC"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 330) rotate(90) scale(210 680)">
      <stop stop-color="#06B6D4" stop-opacity=".22"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .wave-back{animation:back 16s linear infinite}
      .wave-mid{animation:mid 10s linear infinite}
      .wave-front{animation:front 6s ease-in-out infinite}
      .crest{animation:crest 4s ease-in-out infinite}
      @keyframes back{0%{transform:translateX(0)}50%{transform:translateX(-360px)}100%{transform:translateX(0)}}
      @keyframes mid{0%{transform:translateX(0)}50%{transform:translateX(-300px)}100%{transform:translateX(0)}}
      @keyframes front{0%{transform:translateX(0)}50%{transform:translateX(-220px)}100%{transform:translateX(0)}}
      @keyframes crest{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1440" height="520" rx="18" fill="url(#bg)"/>
  <ellipse cx="720" cy="330" rx="600" ry="150" fill="url(#glow)" filter="url(#blur)"/>

  <!-- decorative code mark -->
  <text x="82" y="105" fill="#67E8F9" font-family="monospace" font-size="34" font-weight="700">&lt;/&gt;</text>
  <text x="1315" y="108" fill="#67E8F9" font-family="monospace" font-size="30" font-weight="700">&lt; / &gt;</text>

  <!-- floating dots -->
  <g opacity=".65">
    <circle cx="125" cy="155" r="5" fill="#22D3EE"/>
    <circle cx="205" cy="205" r="3" fill="#818CF8"/>
    <circle cx="330" cy="130" r="4" fill="#67E8F9"/>
    <circle cx="1100" cy="150" r="4" fill="#818CF8"/>
    <circle cx="1225" cy="205" r="5" fill="#22D3EE"/>
    <circle cx="1340" cy="150" r="3" fill="#67E8F9"/>
  </g>

  <!-- back wave -->
  <g class="wave-back">
    <path d="M-360 330 C-180 250 0 420 180 330 S540 250 720 330 S1080 420 1260 330 S1620 250 1800 330 L1800 520 L-360 520Z" fill="url(#back)"/>
  </g>

  <!-- middle wave -->
  <g class="wave-mid">
    <path d="M-300 355 C-120 430 60 270 240 350 S600 430 780 350 S1140 270 1320 350 S1680 430 1860 350 L1860 520 L-300 520Z" fill="url(#mid)" opacity=".68"/>
  </g>

  <!-- front wave -->
  <g class="wave-front">
    <path d="M-220 365 C-40 260 140 470 320 365 S680 260 860 365 S1220 470 1400 365 S1760 260 1940 365 L1940 520 L-220 520Z" fill="url(#front)" opacity=".92"/>
  </g>

  <!-- glowing crest -->
  <path class="crest" d="M-220 365 C-40 260 140 470 320 365 S680 260 860 365 S1220 470 1400 365 S1760 260 1940 365" stroke="url(#crest)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M-220 369 C-40 264 140 474 320 369 S680 264 860 369 S1220 474 1400 369 S1760 264 1940 369" stroke="#67E8F9" stroke-opacity=".38" stroke-width="1.5"/>

  <!-- footer content -->
  <text x="720" y="405" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">
    &lt; Think Differently · Solve Creatively · Learn Deep /&gt;
  </text>
  <text x="720" y="445" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">
    MADE WITH ❤ + ☕ &amp; LOTS OF CODE
  </text>
  <text x="720" y="478" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">
    © 2026 Solyman Wasif · Frontend Developer · Bangladesh 🇧🇩
  </text>
  <text x="720" y="503" text-anchor="middle" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    GitHub · Contact · Keep Building 🚀
  </text>
</svg>
