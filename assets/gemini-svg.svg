<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <g id="alien">
      <path d="M-20,0 L20,0 L30,10 L-30,10 Z" fill="#FF4081" />
      <path d="M-15,-10 L15,-10 L20,0 L-20,0 Z" fill="#F50057" />
      <circle cx="0" cy="-10" r="12" fill="#E0F7FA" opacity="0.8" />
      <circle cx="-5" cy="-12" r="3" fill="#FFFFFF" />
      <circle cx="-15" cy="5" r="2" fill="#FFFF00">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="5" r="2" fill="#FFFF00">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>

    <circle id="star" cx="0" cy="0" r="1.5" fill="#FFFFFF" opacity="0.6" />
  </defs>

  <rect width="800" height="600" fill="#0B0C10" />

  <g>
    <g>
      <use href="#star" x="100" y="50" />
      <use href="#star" x="250" y="150" />
      <use href="#star" x="500" y="80" />
      <use href="#star" x="700" y="250" />
      <use href="#star" x="150" y="400" />
      <use href="#star" x="400" y="500" />
      <use href="#star" x="650" y="450" />
      <use href="#star" x="750" y="100" />
      <use href="#star" x="50" y="550" />
      <use href="#star" x="350" y="300" />
      <use href="#star" x="550" y="350" />
      <animateTransform attributeName="transform" type="translate" values="0,-600; 0,600" dur="4s" repeatCount="indefinite" />
    </g>
    <g>
      <use href="#star" x="100" y="50" />
      <use href="#star" x="250" y="150" />
      <use href="#star" x="500" y="80" />
      <use href="#star" x="700" y="250" />
      <use href="#star" x="150" y="400" />
      <use href="#star" x="400" y="500" />
      <use href="#star" x="650" y="450" />
      <use href="#star" x="750" y="100" />
      <use href="#star" x="50" y="550" />
      <use href="#star" x="350" y="300" />
      <use href="#star" x="550" y="350" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,1200" dur="4s" repeatCount="indefinite" />
    </g>
  </g>

  <g>
    <use href="#alien" x="200" y="100" />
    <use href="#alien" x="300" y="70" />
    <use href="#alien" x="400" y="100" />
    <use href="#alien" x="500" y="70" />
    <use href="#alien" x="600" y="100" />
    
    <rect x="300" y="80" width="4" height="15" fill="#FF1744" rx="2" filter="url(#glow)">
      <animate attributeName="y" values="80; 700; 700" keyTimes="0; 0.6; 1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.59; 0.6; 1" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect x="500" y="80" width="4" height="15" fill="#FF1744" rx="2" filter="url(#glow)">
      <animate attributeName="y" values="80; 700; 700" keyTimes="0; 0.6; 1" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.59; 0.6; 1" dur="2.5s" repeatCount="indefinite" />
    </rect>

    <animateTransform attributeName="transform" type="translate" 
      values="0,0; -100,20; 100,40; -100,60; 100,80; 0,0" 
      dur="12s" repeatCount="indefinite" />
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; -250,0; 250,0; -100,0; 0,0" 
      dur="7s" repeatCount="indefinite" />

    <rect x="393" y="480" width="4" height="20" fill="#00E5FF" rx="2" filter="url(#glow)">
      <animate attributeName="y" values="480; -50; -50" keyTimes="0; 0.4; 1" dur="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.39; 0.4; 1" dur="0.6s" repeatCount="indefinite" />
    </rect>
    <rect x="403" y="480" width="4" height="20" fill="#00E5FF" rx="2" filter="url(#glow)">
      <animate attributeName="y" values="480; -50; -50" keyTimes="0; 0.4; 1" dur="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.39; 0.4; 1" dur="0.6s" repeatCount="indefinite" />
    </rect>

    <polygon points="400,480 430,530 370,530" fill="#45A29E" />
    <polygon points="400,480 410,510 390,510" fill="#C5C6C7" />
    <path d="M370,530 L380,510 L380,540 Z" fill="#66FCF1" />
    <path d="M430,530 L420,510 L420,540 Z" fill="#66FCF1" />
    <rect x="395" y="530" width="10" height="5" fill="#1F2833" />

    <polygon points="395,535 405,535 400,560" fill="#FFC107" filter="url(#glow)">
      <animate attributeName="points" 
        values="395,535 405,535 400,550; 395,535 405,535 400,565; 395,535 405,535 400,550" 
        dur="0.1s" repeatCount="indefinite" />
    </polygon>
    <polygon points="397,535 403,535 400,550" fill="#FF5722">
      <animate attributeName="points" 
        values="397,535 403,535 400,545; 397,535 403,535 400,555; 397,535 403,535 400,545" 
        dur="0.1s" repeatCount="indefinite" />
    </polygon>
  </g>

  <text x="20" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#66FCF1">
    SCORE: <tspan fill="#FFFFFF">014,920</tspan>
  </text>
  
  <text x="650" y="40" font-family="monospace" font-size="24" font-weight="bold" fill="#66FCF1">
    LIVES: 
  </text>
  <polygon points="745,30 755,40 735,40" fill="#45A29E" />
  <polygon points="770,30 780,40 760,40" fill="#45A29E" />

  <text x="400" y="300" font-family="monospace" font-size="48" font-weight="bold" fill="#FFC107" text-anchor="middle" filter="url(#glow)">
    WAVE 3
    <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.2; 0.4; 1" dur="10s" repeatCount="indefinite" />
  </text>
</svg>
