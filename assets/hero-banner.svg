<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="40%" stop-color="#0f0c24" />
      <stop offset="100%" stop-color="#1b123a" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#130b2b" />
      <stop offset="70%" stop-color="#080417" />
      <stop offset="100%" stop-color="#030107" />
    </linearGradient>
    
    <!-- Neon Window/City Glows -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7900ff" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    
    <!-- Code Glow Screen -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7900ff" stop-opacity="0" />
    </radialGradient>
    
    <!-- Lamp Light Cone -->
    <linearGradient id="lampCone" x1="50%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#ffea88" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#ffaa44" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffaa44" stop-opacity="0" />
    </linearGradient>

    <style>
      /* --- Fonts & Typography Config --- */
      @import url('https://googleapis.com');
      
      .text-base {
        fill: #FFFFFF;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      
      .line-welcome {
        font-size: 28px;
        font-weight: 300;
        fill: #a5a1b8;
        letter-spacing: 2px;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0.2s;
      }
      
      .line-name {
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -1px;
        fill: #FFFFFF;
        opacity: 0;
        transform: translateY(40px);
        animation: fadeInUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0.5s;
      }
      
      .name-accent {
        fill: #00f2fe;
        filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
      }
      
      .line-title {
        font-size: 34px;
        font-style: italic;
        font-weight: 400;
        fill: #8b85a8;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 1.1s;
      }
      
      /* --- Text Animation Keyframes --- */
      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* --- Environment & Ambient Loop Animations --- */
      .star { animation: pulseStar 3s infinite ease-in-out; }
      .star-delayed { animation: pulseStar 4s infinite ease-in-out 1.5s; }
      .city-light { animation: blinkLight 5s infinite ease-in-out; }
      .code-line { animation: codeFlow 4s infinite linear; }
      .lamp-glow { animation: ambientFlicker 6s infinite ease-in-out; }
      
      @keyframes pulseStar {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.2); }
      }
      @keyframes blinkLight {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes ambientFlicker {
        0%, 100% { opacity: 0.95; }
        45% { opacity: 1; }
        50% { opacity: 0.92; }
        55% { opacity: 0.98; }
      }
      @keyframes codeFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
    </style>
  </defs>

  <!-- ================= BACKGROUND LAYER ================= -->
  <rect width="1600" height="520" fill="url(#bgGrad)" />

  <!-- ================= RIGHT SIDE: CINEMATIC ENVIRONMENT ================= -->
  <!-- The Room Window Framework -->
  <g id="window-scene" transform="translate(850, 0)">
    <!-- Sky behind window -->
    <rect x="0" y="30" width="700" height="420" rx="15" fill="url(#skyGrad)" />
    
    <!-- Stars -->
    <circle cx="100" cy="90" r="1.5" fill="#fff" class="star" />
    <circle cx="280" cy="70" r="2" fill="#ffe3a0" class="star-delayed" />
    <circle cx="450" cy="120" r="1" fill="#fff" class="star" />
    <circle cx="620" cy="80" r="1.5" fill="#fff" class="star-delayed" />
    
    <!-- Futuristic City Buildings Silhouette -->
    <!-- Tower 1 -->
    <rect x="50" y="220" width="80" height="230" fill="#0b061d" />
    <rect x="65" y="240" width="10" height="15" fill="#ff007f" opacity="0.6" class="city-light" />
    <rect x="95" y="270" width="10" height="15" fill="#00f2fe" opacity="0.4" />
    <rect x="65" y="310" width="10" height="15" fill="#fff" opacity="0.5" class="city-light" />
    
    <!-- Cyber Tower 2 (Main Center Spire) -->
    <path d="M 190 450 L 190 150 L 210 120 L 230 150 L 230 450 Z" fill="#080415" />
    <line x1="210" y1="120" x2="210" y2="450" stroke="url(#neonPink)" stroke-width="2" opacity="0.7" />
    <circle cx="210" cy="115" r="3" fill="#ff007f" class="city-light" />
    
    <!-- Tower 3 -->
    <rect x="290" y="260" width="110" height="190" fill="#0d0822" />
    <rect x="310" y="290" width="25" height="8" fill="#00f2fe" opacity="0.6" class="city-light" />
    <rect x="350" y="290" width="25" height="8" fill="#00f2fe" opacity="0.6" />
    <rect x="310" y="320" width="25" height="8" fill="#7900ff" opacity="0.5" />
    <rect x="350" y="340" width="25" height="8" fill="#fff" opacity="0.7" class="city-light" />
    
    <!-- Tower 4 (Far Right) -->
    <rect x="460" y="180" width="90" height="270" fill="#090518" />
    <path d="M 460 180 L 550 230 L 550 450 L 460 450 Z" fill="#060312" />
    <rect x="490" y="220" width="12" height="30" fill="url(#neonCyan)" opacity="0.5" class="city-light" />
    
    <!-- Window Glass Reflections & Frame -->
    <rect x="0" y="30" width="700" height="420" rx="15" fill="url(#cyberGlow)" stroke="#1a153b" stroke-width="8" />
    <!-- Vertical Window Pane Divider -->
    <line x1="330" y1="30" x2="330" y2="450" stroke="#1c1642" stroke-width="6" />
  </g>

  <!-- Ambient Light from the Room/Desk setup -->
  <circle cx="1250" cy="380" r="350" fill="url(#screenGlow)" />

  <!-- ================= WORKSPACE ELEMENTS (Desk, Monitor, Lamp) ================= -->
  <g id="workspace" transform="translate(1000, 240)">
    <!-- Desk Surface -->
    <polygon points="-150,210 550,210 550,280 -150,280" fill="#0b091a" stroke="#1d1936" stroke-width="2" />
    
    <!-- Large Ultra-wide Monitor -->
    <rect x="20" y="20" width="320" height="150" rx="8" fill="#05030a" stroke="#252142" stroke-width="4" />
    <!-- Monitor Stand -->
    <polygon points="160,170 200,170 210,210 150,210" fill="#120f24" />
    <!-- Abstract Matrix/Code on Screen -->
    <g opacity="0.85">
      <line x1="40" y1="50" x2="180" y2="50" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 15 30 10" class="code-line" />
      <line x1="40" y1="70" x2="260" y2="70" stroke="#ff007f" stroke-width="6" stroke-linecap="round" stroke-dasharray="40 20 10 20" class="code-line" style="animation-duration: 6s;" />
      <line x1="40" y1="90" x2="140" y2="90" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="20 10 5 15" class="code-line" style="animation-duration: 3s;" />
      <line x1="40" y1="110" x2="290" y2="110" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" stroke-dasharray="50 15 30 10" class="code-line" style="animation-duration: 5s;" />
      <line x1="40" y1="130" x2="200" y2="130" stroke="#7900ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="15 10 40 10" class="code-line" />
    </g>
    
    <!-- Premium Desk Lamp -->
    <path d="M 420,210 L 400,100 L 350,80" fill="none" stroke="#1d1936" stroke-width="6" stroke-linecap="round" />
    <!-- Lamp Head -->
    <path d="M 320,95 C 320,70 370,70 370,95 Z" fill="#ffaa44" transform="rotate(-25 345 85)" />
    <!-- Glowing Yellow Lamp Light Cone Overlay -->
    <polygon points="325,95 180,210 480,210" fill="url(#lampCone)" class="lamp-glow" />
  </g>

  <!-- ================= THE DEVELOPER (Hoodie Character) ================= -->
  <g id="developer" transform="translate(1060, 310)">
    <!-- Back / Torso -->
    <path d="M 40,140 Q 20,50 60,30 Q 110,15 140,50 Q 170,90 160,140 Z" fill="#141126" />
    <!-- Hoodie Shadow Contours -->
    <path d="M 40,140 Q 25,65 60,40" fill="none" stroke="#1f1a3a" stroke-width="4" />
    
    <!-- The Hood -->
    <path d="M 60,35 C 50,0 130,-5 135,30 C 140,55 120,65 95,65 C 70,65 65,50 60,35 Z" fill="#1b1733" stroke="#0f0c22" stroke-width="1" />
    <!-- Inner Dark Void of Hood -->
    <path d="M 75,35 C 70,15 120,15 125,32 C 125,48 110,55 98,55 C 85,55 80,48 75,35 Z" fill="#0a0815" />
    
    <!-- Hint of Face / Silhouette illuminated by screen -->
    <path d="M 82,32 C 82,25 112,25 112,32 C 112,42 97,48 97,48 Z" fill="#ffeedd" opacity="0.25" />
    
    <!-- Left & Right Arms Coding -->
    <path d="M 40,140 Q 60,110 90,115" fill="none" stroke="#141126" stroke-width="26" stroke-linecap="round" />
    <path d="M 150,140 Q 130,110 110,115" fill="none" stroke="#141126" stroke-width="26" stroke-linecap="round" />
    <!-- Hands / Keyboard area indicator -->
