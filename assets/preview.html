<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Solyman Wasif — Frontend Developer</title>

  <style>
    :root {
      --bg-primary: #070b14;
      --bg-secondary: #0f172a;

      --indigo: #4338ca;
      --cyan: #06b6d4;
      --cyan-light: #67e8f9;
      --aqua: #a5f3fc;

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --border: rgba(6, 182, 212, 0.12);
    }

    /* =========================
       RESET
    ========================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Inter,
        sans-serif;
    }

    /* =========================
       PAGE WRAPPER
    ========================== */

    .page-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 10%,
          #172554 0%,
          #0c1322 42%,
          #050811 100%
        );
    }

    /* =========================
       HERO SECTION
    ========================== */

    .hero-section {
      position: relative;
      z-index: 5;

      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 60px 24px 30px;

      text-align: center;
    }

    /* Status Badge */

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 22px;
      padding: 7px 16px;

      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 999px;

      background: rgba(15, 23, 42, 0.65);

      color: var(--cyan-light);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      backdrop-filter: blur(12px);

      box-shadow:
        0 0 20px rgba(6, 182, 212, 0.08);
    }

    .badge-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan-light);

      box-shadow:
        0 0 8px rgba(103, 232, 249, 0.9);

      animation:
        pulse-dot 2s ease-in-out infinite;
    }

    /* Main Heading */

    .hero-title {
      max-width: 900px;

      margin-bottom: 18px;

      font-size: clamp(
        2.2rem,
        5vw,
        4.2rem
      );

      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.04em;

      background:
        linear-gradient(
          135deg,
          #ffffff 20%,
          #bae6fd 55%,
          #818cf8 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
    }

    /* Description */

    .hero-subtitle {
      max-width: 680px;

      margin-bottom: 30px;

      color: var(--text-secondary);

      font-size: clamp(
        0.95rem,
        1.5vw,
        1.1rem
      );

      line-height: 1.7;
    }

    /* =========================
       CTA BUTTONS
    ========================== */

    .cta-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;

      padding: 11px 22px;

      font-family: inherit;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #06b6d4,
          #4338ca
        );

      border-color:
        rgba(255, 255, 255, 0.2);

      box-shadow:
        0 10px 25px
        rgba(6, 182, 212, 0.22);
    }

    .btn-primary:hover {
      box-shadow:
        0 14px 30px
        rgba(6, 182, 212, 0.35);
    }

    .btn-secondary {
      color: #e2e8f0;

      background:
        rgba(15, 23, 42, 0.7);

      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      border-color:
        rgba(6, 182, 212, 0.35);
    }

    /* =========================
       WAVE CONTAINER
    ========================== */

    .wave-divider {
      position: relative;

      width: 100%;
      height: 300px;

      overflow: hidden;

      margin-top: auto;
    }

    .wave-svg {
      display: block;

      width: 100%;
      height: 100%;

      overflow: visible;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer {
      position: relative;
      z-index: 10;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 18px 40px;

      background: var(--bg-secondary);

      border-top:
        1px solid var(--border);
    }

    .footer-text {
      color: var(--text-muted);

      font-size: 13px;
      line-height: 1.5;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .footer-link {
      color: var(--text-secondary);

      font-size: 13px;
      font-weight: 500;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--cyan-light);
    }

    /* =========================
       WAVE ANIMATIONS
    ========================== */

    @keyframes wave-back {
      0% {
        transform:
          translate3d(0, 0, 0);
      }

      50% {
        transform:
          translate3d(-720px, 4px, 0);
      }

      100% {
        transform:
          translate3d(-1440px, 0, 0);
      }
    }

    @keyframes wave-middle {
      0% {
        transform:
          translate3d(0, 0, 0);
      }

      50% {
        transform:
          translate3d(-720px, -6px, 0);
      }

      100% {
        transform:
          translate3d(-1440px, 0, 0);
      }
    }

    @keyframes wave-front {
      0% {
        transform:
          translate3d(0, 0, 0);
      }

      50% {
        transform:
          translate3d(-720px, 6px, 0);
      }

      100% {
        transform:
          translate3d(-1440px, 0, 0);
      }
    }

    @keyframes crest-glow {
      0%,
      100% {
        opacity: 0.35;

        filter:
          drop-shadow(
            0 0 8px
            rgba(6, 182, 212, 0.4)
          );
      }

      50% {
        opacity: 0.9;

        filter:
          drop-shadow(
            0 0 20px
            rgba(103, 232, 249, 0.85)
          );
      }
    }

    @keyframes pulse-dot {
      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.35);
        opacity: 1;
      }
    }

    /* Animation Classes */

    .wave-back {
      animation:
        wave-back
        16s
        cubic-bezier(0.42, 0, 0.58, 1)
        infinite;
    }

    .wave-middle {
      animation:
        wave-middle
        10s
        cubic-bezier(0.37, 0, 0.63, 1)
        infinite;
    }

    .wave-front {
      animation:
        wave-front
        6s
        cubic-bezier(0.45, 0.05, 0.55, 0.95)
        infinite;
    }

    .crest {
      animation:
        crest-glow
        4.5s
        ease-in-out
        infinite;
    }

    /* Pause State */

    .is-paused * {
      animation-play-state: paused !important;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 768px) {
      .hero-section {
        padding: 50px 20px 20px;
      }

      .hero-title {
        font-size: clamp(
          2rem,
          9vw,
          3rem
        );
      }

      .hero-subtitle {
        font-size: 0.95rem;
      }

      .wave-divider {
        height: 220px;
      }

      .footer {
        flex-direction: column;

        padding: 18px 20px;

        text-align: center;
      }

      .footer-links {
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-play-state: paused !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="page-wrapper" id="page-wrapper">

    <!-- =========================
         HERO
    ========================== -->

    <main class="hero-section">

      <div class="badge">
        <span class="badge-dot"></span>
        Frontend Developer
      </div>

      <h1 class="hero-title">
        Think Differently · Build Creatively
      </h1>

      <p class="hero-subtitle">
        Building modern, responsive web experiences
        with clean code, creative ideas, and a
        continuous learning mindset.
      </p>

      <div class="cta-group">

        <button
          class="btn btn-primary"
          type="button"
          id="reset-btn"
        >
          Re-Sync Animation
        </button>

        <button
          class="btn btn-secondary"
          type="button"
          id="toggle-btn"
        >
          Pause Animation
        </button>

      </div>

    </main>


    <!-- =========================
         LIQUID WAVE DIVIDER
    ========================== -->

    <div class="wave-divider">

      <svg
        id="liquid-wave-svg"
        class="wave-svg"
        viewBox="0 0 1440 320"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <defs>

          <!-- Back Wave Gradient -->

          <linearGradient
            id="back-gradient"
            x1="0%"
            y1="0%"
            x2="0%"
            y2="100%"
          >

            <stop
              offset="0%"
              stop-color="#06B6D4"
              stop-opacity="0.9"
            />

            <stop
              offset="35%"
              stop-color="#4338CA"
              stop-opacity="0.65"
            />

            <stop
              offset="75%"
              stop-color="#1E1B4B"
              stop-opacity="0.85"
            />

            <stop
              offset="100%"
              stop-color="#0F172A"
              stop-opacity="1"
            />

          </linearGradient>


          <!-- Middle Wave Gradient -->

          <linearGradient
            id="middle-gradient"
            x1="0%"
            y1="0%"
            x2="0%"
            y2="100%"
          >

            <stop
              offset="0%"
              stop-color="#67E8F9"
              stop-opacity="0.95"
            />

            <stop
              offset="25%"
              stop-color="#06B6D4"
              stop-opacity="0.8"
            />

            <stop
              offset="60%"
              stop-color="#4338CA"
              stop-opacity="0.7"
            />

            <stop
              offset="100%"
              stop-color="#0F172A"
              stop-opacity="1"
            />

          </linearGradient>


          <!-- Front Wave Gradient -->

          <linearGradient
            id="front-gradient"
            x1="0%"
            y1="0%"
            x2="0%"
            y2="100%"
          >

            <stop
              offset="0%"
              stop-color="#A5F3FC"
              stop-opacity="1"
            />

            <stop
              offset="8%"
              stop-color="#22D3EE"
              stop-opacity="0.95"
            />

            <stop
              offset="30%"
              stop-color="#06B6D4"
              stop-opacity="0.9"
            />

            <stop
              offset="65%"
              stop-color="#4338CA"
              stop-opacity="0.95"
            />

            <stop
              offset="100%"
              stop-color="#0F172A"
              stop-opacity="1"
            />

          </linearGradient>


          <!-- Crest Gradient -->

          <linearGradient
            id="crest-gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="0%"
          >

            <stop
              offset="0%"
              stop-color="#67E8F9"
              stop-opacity="0.2"
            />

            <stop
              offset="25%"
              stop-color="#A5F3FC"
              stop-opacity="0.9"
            />

            <stop
              offset="50%"
              stop-color="#22D3EE"
              stop-opacity="1"
            />

            <stop
              offset="75%"
              stop-color="#818CF8"
              stop-opacity="0.9"
            />

            <stop
              offset="100%"
              stop-color="#67E8F9"
              stop-opacity="0.2"
            />

          </linearGradient>


          <!-- Ambient Glow -->

          <radialGradient
            id="ambient-glow"
            cx="50%"
            cy="100%"
            r="70%"
          >

            <stop
              offset="0%"
              stop-color="#06B6D4"
              stop-opacity="0.2"
            />

            <stop
              offset="60%"
              stop-color="#4338CA"
              stop-opacity="0.05"
            />

            <stop
              offset="100%"
              stop-color="#0F172A"
              stop-opacity="0"
            />

          </radialGradient>


          <!-- Soft Glow Filter -->

          <filter
            id="soft-glow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
          >

            <feGaussianBlur
              stdDeviation="3"
              result="blur"
            />

            <feComposite
              in="SourceGraphic"
              in2="blur"
              operator="over"
            />

          </filter>

        </defs>


        <!-- Ambient Background -->

        <rect
          x="0"
          y="0"
          width="1440"
          height="320"
          fill="url(#ambient-glow)"
        />


        <!-- =========================
             BACK WAVE
        ========================== -->

        <g
          class="wave-back"
          opacity="0.25"
        >

          <path
            d="
              M 0,160
              C 180,95 360,225 540,165
              C 720,105 900,215 1080,155
              C 1260,95 1350,195 1440,160

              C 1620,95 1800,225 1980,165
              C 2160,105 2340,215 2520,155
              C 2700,95 2790,195 2880,160

              L 2880,320
              L 0,320
              Z
            "

            fill="url(#back-gradient)"
          />

        </g>


        <!-- =========================
             MIDDLE WAVE
        ========================== -->

        <g
          class="wave-middle"
          opacity="0.5"
        >

          <path
            d="
              M 0,190
              C 160,250 320,120 480,175
              C 640,230 800,130 960,185
              C 1120,240 1280,135 1440,190

              C 1600,250 1760,120 1920,175
              C 2080,230 2240,130 2400,185
              C 2560,240 2720,135 2880,190

              L 2880,320
              L 0,320
              Z
            "

            fill="url(#middle-gradient)"
          />

        </g>


        <!-- =========================
             FRONT WAVE
        ========================== -->

        <g
          class="wave-front"
          opacity="0.9"
        >

          <!-- Main Wave -->

          <path
            d="
              M 0,220
              C 120,140 240,270 360,210
              C 480,150 600,275 720,215
              C 840,155 960,280 1080,220
              C 1200,160 1320,270 1440,220

              C 1560,140 1680,270 1800,210
              C 1920,150 2040,275 2160,215
              C 2280,155 2400,280 2520,220
              C 2640,160 2760,270 2880,220

              L 2880,320
              L 0,320
              Z
            "

            fill="url(#front-gradient)"
          />


          <!-- Glowing Crest -->

          <path
            class="crest"
            d="
              M 0,220
              C 120,140 240,270 360,210
              C 480,150 600,275 720,215
              C 840,155 960,280 1080,220
              C 1200,160 1320,270 1440,220

              C 1560,140 1680,270 1800,210
              C 1920,150 2040,275 2160,215
              C 2280,155 2400,280 2520,220
              C 2640,160 2760,270 2880,220
            "

            fill="none"

            stroke="url(#crest-gradient)"

            stroke-width="3"

            stroke-linecap="round"

            filter="url(#soft-glow)"
          />


          <!-- Secondary Crest -->

          <path
            d="
              M 0,222
              C 120,143 240,272 360,212
              C 480,153 600,277 720,217
              C 840,158 960,282 1080,222
              C 1200,163 1320,272 1440,222

              C 1560,143 1680,272 1800,212
              C 1920,153 2040,277 2160,217
              C 2280,158 2400,282 2520,222
              C 2640,163 2760,272 2880,222
            "

            fill="none"

            stroke="#67E8F9"

            stroke-width="1"

            stroke-opacity="0.4"
          />

        </g>

      </svg>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

      <span class="footer-text">
        © 2026 Solyman Wasif · Built with curiosity & code
      </span>

      <div class="footer-links">

        <a
          href="https://github.com/Solymanwasif"
          class="footer-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>

        <a
          href="mailto:reonsolymanwasif@gmail.com"
          class="footer-link"
        >
          Contact
        </a>

        <span class="footer-link">
          Bangladesh 🇧🇩
        </span>

      </div>

    </footer>

  </div>


  <!-- =========================
       ANIMATION CONTROL
  ========================== -->

  <script>
    (() => {
      const page =
        document.getElementById("page-wrapper");

      const toggleButton =
        document.getElementById("toggle-btn");

      const resetButton =
        document.getElementById("reset-btn");

      let isPaused = false;


      /* Toggle Animation */

      toggleButton.addEventListener(
        "click",
        () => {
          isPaused = !isPaused;

          page.classList.toggle(
            "is-paused",
            isPaused
          );

          toggleButton.textContent =
            isPaused
              ? "Resume Animation"
              : "Pause Animation";
        }
      );


      /* Re-Sync Animation */

      resetButton.addEventListener(
        "click",
        () => {
          page.classList.add("is-paused");

          void page.offsetWidth;

          page.classList.remove("is-paused");

          isPaused = false;

          toggleButton.textContent =
            "Pause Animation";
        }
      );


      /* Respect Reduced Motion */

      if (
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        page.classList.add("is-paused");

        isPaused = true;

        toggleButton.textContent =
          "Resume Animation";
      }

    })();
  </script>

</body>
</html>
