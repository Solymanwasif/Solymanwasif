<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Solyman Wasif — Full Stack Developer</title>
  <desc id="desc">Dark cinematic developer workspace at night with a city skyline, coding laptop and introduction text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030711"/>
      <stop offset=".48" stop-color="#071322"/>
      <stop offset="1" stop-color="#02050b"/>
    </linearGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020812"/>
      <stop offset=".65" stop-color="#07182a"/>
      <stop offset="1" stop-color="#10283b"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d78ff"/>
      <stop offset="1" stop-color="#4ab8ff"/>
    </linearGradient>

    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d0" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="screenGlow">
      <stop offset="0" stop-color="#239dff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#239dff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset="1" stop-color="#03070e"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .ui { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .small { fill:#b7c1cc; font-size:24px; letter-spacing:2px; }
      .name { fill:#f4f7fb; font-size:78px; font-weight:800; letter-spacing:1px; }
      .role { fill:#eef3f8; font-size:34px; font-weight:600; }
      .muted { fill:#8996a5; font-size:18px; letter-spacing:1.1px; }
      .code { font-family: Consolas, "Courier New", monospace; font-size:10px; }
      .blink { animation: blink 1.1s steps(2,end) infinite; }
      .lights { animation: lights 4s ease-in-out infinite; }
      .stars { animation: stars 3.5s ease-in-out infinite; }
      @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:0} }
      @keyframes lights { 0%,100%{opacity:.45} 50%{opacity:1} }
      @keyframes stars { 0%,100%{opacity:.25} 50%{opacity:.9} }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="520" fill="url(#bg)"/>
  <ellipse cx="1180" cy="330" rx="500" ry="260" fill="#1688ff" opacity=".055" filter="url(#soft)"/>
  <ellipse cx="410" cy="430" rx="390" ry="190" fill="#0a68c9" opacity=".045" filter="url(#soft)"/>

  <!-- WINDOW -->
  <rect x="705" y="0" width="895" height="420" fill="url(#sky)"/>
  <rect x="720" y="0" width="3" height="420" fill="#182d40"/>
  <rect x="1190" y="0" width="3" height="420" fill="#182d40"/>

  <!-- CLOUDS -->
  <path d="M735 112 C850 55 925 85 1015 48 C1100 14 1190 50 1270 22 C1390 -18 1500 35 1600 8 L1600 0 L735 0Z"
        fill="#0b1725" opacity=".75"/>
  <path d="M760 185 C850 145 910 158 1000 126 C1100 91 1180 130 1260 101 C1390 55 1500 110 1600 76"
        fill="none" stroke="#193044" stroke-width="20" opacity=".35"/>

  <!-- STARS / METEOR -->
  <g class="stars" fill="#dceeff">
    <circle cx="820" cy="55" r="1.5"/><circle cx="915" cy="92" r="1"/>
    <circle cx="1045" cy="45" r="1.4"/><circle cx="1270" cy="70" r="1"/>
    <circle cx="1420" cy="48" r="1.5"/><circle cx="1510" cy="125" r="1"/>
  </g>
  <path d="M1015 128 l48 -55" stroke="#bfe6ff" stroke-width="2" opacity=".8"/>
  <circle cx="1015" cy="128" r="3" fill="#dff5ff" filter="url(#glow)"/>

  <!-- CITY -->
  <g>
    <path d="M705 365 L705 285 L748 285 L748 242 L792 242 L792 318 L826 318 L826 218 L885 218 L885 350 L915 350 L915 272 L960 272 L960 192 L1012 192 L1012 345 L1040 345 L1040 250 L1088 250 L1088 355 L1120 355 L1120 205 L1165 205 L1165 365 Z"
          fill="#07111c"/>
    <path d="M1192 380 L1192 175 L1245 145 L1290 175 L1290 380 Z" fill="#06101a"/>
    <rect x="1220" y="124" width="4" height="22" fill="#2d8dff"/>
    <circle cx="1222" cy="120" r="3" fill="#55aaff" filter="url(#glow)"/>
    <rect x="1320" y="220" width="74" height="160" fill="#07111c"/>
    <rect x="1410" y="155" width="105" height="225" fill="#06101a"/>
    <rect x="1535" y="255" width="65" height="125" fill="#07111c"/>

    <g fill="#9bcfff" opacity=".55" class="lights">
      <rect x="733" y="300" width="7" height="5"/><rect x="766" y="260" width="7" height="5"/>
      <rect x="839" y="245" width="8" height="5"/><rect x="857" y="270" width="8" height="5"/>
      <rect x="975" y="220" width="8" height="5"/><rect x="994" y="248" width="8" height="5"/>
      <rect x="1055" y="280" width="8" height="5"/><rect x="1074" y="306" width="8" height="5"/>
      <rect x="1135" y="235" width="8" height="5"/><rect x="1150" y="268" width="8" height="5"/>
      <rect x="1210" y="205" width="9" height="5"/><rect x="1250" y="230" width="9" height="5"/>
      <rect x="1338" y="250" width="8" height="5"/><rect x="1360" y="285" width="8" height="5"/>
      <rect x="1432" y="190" width="9" height="5"/><rect x="1470" y="235" width="9" height="5"/>
      <rect x="1550" y="285" width="8" height="5"/>
    </g>
  </g>

  <!-- DESK / FLOOR -->
  <path d="M670 402 H1600 V520 H670Z" fill="#05080d"/>
  <path d="M670 403 H1600" stroke="#1a2733" stroke-width="4"/>
  <path d="M720 480 H1600" stroke="#0e1822" stroke-width="2"/>

  <!-- DESK OBJECTS LEFT -->
  <g transform="translate(785 344)">
    <ellipse cx="60" cy="90" rx="72" ry="12" fill="#02050a"/>
    <rect x="22" y="32" width="74" height="54" rx="8" fill="#101923" stroke="#2a3a48"/>
    <path d="M31 36 Q59 18 87 36" fill="none" stroke="#344957" stroke-width="3"/>
    <path d="M42 46 C35 30 70 27 77 46 C70 62 48 64 42 46Z" fill="#132b1f"/>
    <path d="M51 41 C52 31 62 31 65 41" fill="none" stroke="#39704b" stroke-width="2"/>
  </g>

  <!-- LAPTOP GLOW -->
  <ellipse cx="1175" cy="415" rx="300" ry="115" fill="url(#screenGlow)"/>

  <!-- LAPTOP -->
  <g transform="translate(930 252)">
    <polygon points="15,10 335,0 380,178 45,188" fill="#0b1118" stroke="#263746" stroke-width="4"/>
    <polygon points="29,21 325,13 363,164 55,174" fill="#06101a"/>
    <polygon points="45,31 316,24 348,154 70,164" fill="#081827"/>

    <!-- code -->
    <g class="code" opacity=".9">
      <text x="58" y="52" fill="#68c7ff">const</text><text x="91" y="52" fill="#dfe8ef"> developer = </text><text x="155" y="52" fill="#7ee787">"Solyman"</text>
      <text x="58" y="68" fill="#a9b6c2">function</text><text x="111" y="68" fill="#64d8ff"> buildFuture</text><text x="176" y="68" fill="#dfe8ef">() {</text>
      <text x="68" y="84" fill="#ffcf70">return</text><text x="108" y="84" fill="#dfe8ef"> creativity + logic;</text>
      <text x="68" y="100" fill="#8be9a8">while</text><text x="104" y="100" fill="#dfe8ef"> (learning) {</text>
      <text x="78" y="116" fill="#65a9ff">solveProblems</text><text x="154" y="116" fill="#dfe8ef">();</text>
      <text x="78" y="132" fill="#65a9ff">shipProjects</text><text x="148" y="132" fill="#dfe8ef">();</text>
      <text x="68" y="148" fill="#dfe8ef">}</text>
    </g>
    <rect x="220" y="139" width="6" height="10" fill="#4db5ff" class="blink"/>
    <!-- base -->
    <path d="M0 190 L385 179 L475 225 Q480 234 465 236 L45 246 Q32 245 27 238Z" fill="#0a1017" stroke="#263746" stroke-width="3"/>
    <path d="M105 215 L360 208" stroke="#243746" stroke-width="2"/>
    <path d="M140 221 L320 216" stroke="#162532" stroke-width="2"/>
  </g>

  <!-- LAMP -->
  <g>
    <path d="M1010 350 L1035 190 L1100 135" fill="none" stroke="#111a22" stroke-width="10" stroke-linecap="round"/>
    <path d="M1095 138 L1145 95" stroke="#17232d" stroke-width="10" stroke-linecap="round"/>
    <path d="M1132 87 Q1182 83 1194 118 L1145 126 Q1125 112 1132 87Z" fill="#0d151d" stroke="#263541" stroke-width="3"/>
    <ellipse cx="1160" cy="119" rx="20" ry="9" fill="#fff3bd"/>
    <path d="M1145 126 L1035 360 L1275 360Z" fill="url(#lamp)" opacity=".55"/>
  </g>

  <!-- DEVELOPER SILHOUETTE -->
  <g transform="translate(1220 180)">
    <!-- chair -->
    <path d="M175 215 Q225 190 300 215 L330 420 L115 420Z" fill="#060b12" stroke="#17232e" stroke-width="4"/>
    <!-- hoodie body -->
    <path d="M60 90 Q88 45 142 50 Q210 58 238 122 L258 270 L72 290 L38 190Z" fill="url(#hood)" stroke="#182532" stroke-width="3"/>
    <!-- hood -->
    <path d="M72 92 Q55 25 122 4 Q200 -16 231 58 Q242 92 216 120 Q177 139 122 121 Q86 115 72 92Z" fill="#0a1119"/>
    <path d="M101 67 Q118 28 171 38 Q205 45 215 73 Q196 109 151 111 Q112 106 101 67Z" fill="#02060b"/>
    <!-- hair -->
    <path d="M100 62 Q93 22 130 5 Q174 -16 211 21 Q227 36 221 66 Q201 45 177 45 Q140 45 100 62Z" fill="#111c25"/>
    <!-- neck -->
    <path d="M145 107 Q164 120 185 108 L190 142 L143 142Z" fill="#b89176" opacity=".45"/>
    <!-- arm to keyboard -->
    <path d="M72 188 Q132 190 170 238" fill="none" stroke="#0c151e" stroke-width="45" stroke-linecap="round"/>
    <path d="M205 185 Q181 203 171 238" fill="none" stroke="#0c151e" stroke-width="42" stroke-linecap="round"/>
    <circle cx="170" cy="239" r="11" fill="#b99179" opacity=".65"/>
    <circle cx="195" cy="231" r="10" fill="#b99179" opacity=".65"/>
  </g>

  <!-- LEFT CONTENT -->
  <g class="ui">
    <text x="95" y="175" class="small">HELLO, I AM</text>
    <text x="90" y="255" class="name">SOLYMAN <tspan fill="url(#blue)">WASIF</tspan></text>
    <text x="95" y="309" class="role">I am <tspan fill="url(#blue)">Full Stack Developer.</tspan></text>
    <rect x="95" y="334" width="250" height="3" rx="2" fill="#1e8fff"/>
    <rect x="350" y="334" width="45" height="3" rx="2" fill="#34566f"/>
    <text x="95" y="375" class="muted">Building • Learning • Creating • Improving</text>
    <text x="95" y="407" class="muted" opacity=".72">Turning ideas into useful digital experiences.</text>
  </g>

  <!-- FRAME -->
  <rect x="18" y="18" width="1564" height="484" rx="18" fill="none" stroke="#1b2b38" stroke-width="2"/>
  <rect width="1600" height="520" fill="none" stroke="#02050a" stroke-width="30" opacity=".6"/>
</svg>