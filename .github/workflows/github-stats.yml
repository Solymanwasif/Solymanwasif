name: Update GitHub Stats

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allows you to run it manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Checkout your profile repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate GitHub Stats
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&bg_color=0d1117
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate Top Languages
      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=radical&no-frame=true&no-bg=true&margin-w=6&column=6'
          path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=radical&hide_border=true&bg_color=0d1117
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Commit generated SVG files
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-langs.svg

          git commit -m "Update GitHub stats" || exit 0

          git push
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-langs.svg assets/github-trophies.svg

          git commit -m "Update GitHub stats and trophies" || exit 0

          git push
